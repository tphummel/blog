<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tomhummel.com - charades</title>
  <style>
    :root {
      --bg: #fafafa; --fg: #222; --muted: #777; --accent: #2b6cb0; --border: #ccc;
      --card: #fff; --win: #2f855a; --loss: #c53030; --soft: #eee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1c1d; --fg: #e6e6e6; --muted: #999; --accent: #63a4e0; --border: #444;
        --card: #252627; --win: #68d391; --loss: #fc8181; --soft: #2f3031;
      }
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); max-width: 40rem; margin: 0 auto; padding: 1rem; }
    h1 { font-size: 1.3rem; margin: 0; }
    h2 { font-size: 1.05rem; margin: 0 0 0.5rem; }
    a { color: var(--accent); }
    button, select, input { font: inherit; color: var(--fg); padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; background: var(--card); }
    button { cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.danger { background: var(--loss); border-color: var(--loss); color: #fff; }
    label { display: block; margin: 0.75rem 0 0.25rem; font-weight: 600; font-size: 0.9rem; }
    select, input[type="text"], input[type="number"], input[type="datetime-local"] { width: 100%; }
    header { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 0.75rem; }
    header .name { flex: 1 1 10rem; font-weight: 600; }
    .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 1rem; }
    .tabs button { flex: 1; border: 0; border-radius: 6px 6px 0 0; background: none; font-weight: 600; color: var(--muted); }
    .tabs button[aria-selected="true"] { color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 0.9rem; margin-bottom: 1rem; }
    .row { display: flex; gap: 0.5rem; align-items: center; }
    .row > input { flex: 1; }
    .seg { display: flex; gap: 0.5rem; }
    .seg button { flex: 1; }
    .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.6rem; }
    .chip { display: inline-flex; align-items: center; gap: 0.3rem; background: var(--soft); border-radius: 999px; padding: 0.15rem 0.3rem 0.15rem 0.7rem; }
    .chip button { padding: 0 0.45rem; border: 0; background: none; color: var(--muted); }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .stage { text-align: center; padding: 1.5rem 1rem; }
    .clue { font-size: 2.2rem; font-weight: 700; word-break: break-word; margin: 1rem 0; }
    .timer { font-size: 4.5rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 0.5rem 0; }
    .timer.low { color: var(--loss); }
    .stage .big { width: 100%; padding: 1rem; font-size: 1.3rem; margin-top: 0.5rem; }
    .won { color: var(--win); } .lost { color: var(--loss); }
    .result { font-size: 1.6rem; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.4rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 0.85rem; }
    td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
    .round { border-bottom: 1px solid var(--border); padding: 0.6rem 0; }
    .round:last-child { border-bottom: 0; }
    .round .top { display: flex; justify-content: space-between; gap: 0.5rem; font-weight: 600; }
    .round .btns { display: flex; gap: 0.4rem; margin-top: 0.4rem; }
    .round .btns button { padding: 0.2rem 0.6rem; font-size: 0.85rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 0.6rem; }
    .form-grid .full { grid-column: 1 / -1; }
    dialog { max-width: 36rem; width: calc(100% - 2rem); background: var(--card); color: var(--fg); border: 1px solid var(--border); border-radius: 10px; }
    dialog::backdrop { background: rgba(0,0,0,0.5); }
    .game { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; padding: 0.6rem 0; border-bottom: 1px solid var(--border); }
    .game .info { flex: 1 1 10rem; }
    .game button { padding: 0.25rem 0.6rem; font-size: 0.85rem; }
    .game.current .info strong::after { content: " (open)"; color: var(--accent); font-weight: 400; }
  </style>
</head>
<body>
  <header>
    <h1>Charades</h1>
    <input id="game-name" class="name" type="text" aria-label="Game name">
    <button type="button" id="new-game" class="primary">New game</button>
    <button type="button" id="games-btn">Games</button>

  <div class="tabs" role="tablist">

    <button type="button" role="tab" data-tab="score" aria-selected="false">Scoreboard</button>
    <button type="button" role="tab" data-tab="history" aria-selected="false">History</button>
  </div>

  <section id="pane-play"></section>
  <section id="pane-score" hidden></section>
  <section id="pane-history" hidden></section>

  <dialog id="games-dialog">
    <div class="row" style="justify-content: space-between; margin-bottom: 0.5rem">
      <h2 style="margin:0">All games</h2>
      <button type="button" id="games-close">Close</button>
    </div>
    <div id="games-list"></div>
    <div class="row" style="margin-top: 0.75rem">
      <button type="button" id="export-all">Export all games</button>
    </div>
  </dialog>

    function uid () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7) }
    function pad (n) { return String(n).padStart(2, '0') }
    function fmtTime (sec) {
      sec = Math.max(0, Math.round(sec))
      return Math.floor(sec / 60) + ':' + pad(sec % 60)
    }
    function fmtDate (ts) {
      return new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
    }
    function toLocalInput (ts) {
      return new Date(ts - new Date(ts).getTimezoneOffset() * 60000).toISOString().slice(0, 16)
    }

    function makeGame () {
      return {
        id: uid(),
        name: 'Game ' + new Date().toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }),
        createdAt: Date.now(),
        teams: [],
        rounds: []
      }
    }
    if (!state.games.length) { state.games.push(makeGame()); }
    if (!state.games.some(g => g.id === state.currentId)) state.currentId = state.games[0].id
    save()

    function game () { return state.games.find(g => g.id === state.currentId) }
    function teamName (g, id) { const t = g.teams.find(t => t.id === id); return t ? t.name : '(removed team)' }

    // ---- dom helpers -----------------------------------------------------
    function h (tag, attrs, ...kids) {
      const el = document.createElement(tag)
      for (const [k, v] of Object.entries(attrs || {})) {
        if (k === 'class') el.className = v
        else if (k.startsWith('on')) el[k] = v
        else if (v === true) el.setAttribute(k, '')
        else if (v !== false && v != null) el.setAttribute(k, v)
      }
      kids.flat().forEach(k => { if (k != null && k !== false) el.append(k) })
      return el
    }
    function field (label, input, cls) {
      return h('div', { class: cls || '' }, h('label', {}, label), input)
    }
    // delete-style button: first click arms it, second click within 3s runs fn
    function twoClick (label, fn, armedLabel) {
      let timer = null
      const b = h('button', { type: 'button' }, label)
      b.onclick = () => {
        if (timer) { clearTimeout(timer); timer = null; fn(); return }
        b.textContent = armedLabel || 'Sure?'
        b.classList.add('danger')
        timer = setTimeout(() => { timer = null; b.textContent = label; b.classList.remove('danger') }, 3000)
      }
      return b
    }
    function options (values, selected) {
      return values.map(v => {
        const [val, text] = Array.isArray(v) ? v : [v, v]
        return h('option', { value: val, selected: val === selected }, text)
      })
    }
    function categories () { return Object.keys(CLUES) }

    // ---- play flow -------------------------------------------------------
    // phase: setup -> clue -> running -> done
    let play = { phase: 'setup', teamId: null, actor: '', clue: null, limit: 120, startedAt: 0, endAt: 0, result: null }
    let tickId = null
    let timerEl = null

    function resetPlay () {
      clearInterval(tickId)
      tickId = null
      play = { phase: 'setup', teamId: null, actor: '', clue: null, limit: 120, startedAt: 0, endAt: 0, result: null }
    }

    function nextTeamId (g) {
      if (!g.teams.length) return null
      if (!g.rounds.length) return g.teams[0].id
      const last = g.rounds.reduce((a, b) => (b.ts > a.ts ? b : a))
      const i = g.teams.findIndex(t => t.id === last.teamId)
      return g.teams[(i + 1) % g.teams.length].id
    }

    function pickClue (g, avoid) {
      const { difficulty, category } = state.prefs
      const cats = category === ALL || !CLUES[category] ? categories() : [category]
      const all = cats.flatMap(c => CLUES[c][difficulty].map(text => ({ clue: text, category: c, difficulty })))
      const usedTexts = new Set(g.rounds.map(r => r.clue))
      let pool = all.filter(c => !usedTexts.has(c.clue) && c.clue !== avoid)
      if (!pool.length) pool = all.filter(c => c.clue !== avoid)
      return pool[Math.floor(Math.random() * pool.length)]
    }

    function getClue () {
      const g = game()
      if (!play.teamId || !g.teams.some(t => t.id === play.teamId)) play.teamId = nextTeamId(g)
      play.limit = Math.round(state.prefs.minutes * 60)
      play.clue = pickClue(g)
      play.phase = 'clue'
      renderPlay()
    }

    function startRound () {
      play.phase = 'running'
      play.startedAt = Date.now()
      play.endAt = play.startedAt + play.limit * 1000
      clearInterval(tickId)
      tickId = setInterval(tick, 200)
      renderPlay()
    }

    function tick () {
      const left = play.endAt - Date.now()
      if (left <= 0) return finish(false)
      if (timerEl) {
        timerEl.textContent = fmtTime(Math.ceil(left / 1000))
        timerEl.classList.toggle('low', left <= 10000)
      }
    }

    function finish (won) {
      clearInterval(tickId)
      tickId = null
      const g = game()
      const elapsed = won ? Math.min(play.limit, Math.round((Date.now() - play.startedAt) / 100) / 10) : play.limit
      const round = {
        id: uid(), ts: play.startedAt, teamId: play.teamId, actor: play.actor.trim(),
        clue: play.clue.clue, category: play.clue.category, difficulty: play.clue.difficulty,
        limit: play.limit, elapsed, won
      }
      g.rounds.push(round)
      save()
      play.phase = 'done'
      play.result = round
      play.actor = ''
      play.teamId = null // re-derive the next team in rotation
      renderAll()
    }

    function addTeam (name) {
      name = name.trim()
      if (!name) return
      const g = game()
      if (g.teams.some(t => t.name.toLowerCase() === name.toLowerCase())) return
      g.teams.push({ id: uid(), name })
      save()
      renderAll()
    }

    function removeTeam (id) {
      const g = game()
      g.teams = g.teams.filter(t => t.id !== id)
      if (play.teamId === id) play.teamId = null
      save()
      renderAll()
    }

    function renderPlay () {
      const pane = document.getElementById('pane-play')
      const g = game()
      timerEl = null
      pane.replaceChildren()

      if (play.phase === 'setup' || play.phase === 'done') {
        if (play.phase === 'done') pane.append(renderResult(g))
        pane.append(renderTeams(g), renderSetup(g))
        return
      }

      const who = h('p', { class: 'muted' }, teamName(g, play.teamId) + (play.actor.trim() ? ' — ' + play.actor.trim() : ''))
      const meta = h('p', { class: 'muted' }, play.clue.difficulty + ' · ' + play.clue.category + ' · ' + fmtTime(play.limit))

      if (play.phase === 'clue') {
        pane.append(h('div', { class: 'card stage' },
          who,
          h('p', { class: 'muted' }, 'Actor: look at the clue, then press Start. It will be hidden.'),
          h('div', { class: 'clue' }, play.clue.clue),
          meta,
          h('button', { type: 'button', class: 'primary big', onclick: startRound }, 'Start'),
          h('div', { class: 'row', style: 'margin-top:0.5rem' },
            h('button', { type: 'button', style: 'flex:1', onclick: () => { play.clue = pickClue(g, play.clue.clue); renderPlay() } }, 'Different clue'),
            h('button', { type: 'button', style: 'flex:1', onclick: () => { play.phase = 'setup'; renderPlay() } }, 'Back'))))
        return
      }

      // running
      timerEl = h('div', { class: 'timer' }, fmtTime(Math.ceil((play.endAt - Date.now()) / 1000)))
      pane.append(h('div', { class: 'card stage' },
        who,
        timerEl,
        h('p', { class: 'muted' }, 'Clue hidden'),
        h('button', { type: 'button', class: 'primary big', onclick: () => finish(true) }, 'Solved!'),
        h('div', { style: 'margin-top:1rem' },
          twoClick('Cancel round', () => { resetPlay(); renderPlay() }, 'Discard round?'))))
    }

    function renderResult (g) {
      const r = play.result
      return h('div', { class: 'card stage' },
        h('div', { class: 'result ' + (r.won ? 'won' : 'lost') }, r.won ? 'Solved in ' + fmtTime(r.elapsed) + '!' : "Time's up!"),
        h('div', { class: 'clue' }, r.clue),
        h('p', { class: 'muted' }, teamName(g, r.teamId) + (r.actor ? ' — ' + r.actor : '')))
    }

    function renderTeams (g) {
      const input = h('input', { type: 'text', placeholder: 'Team name', 'aria-label': 'New team name' })
      const add = () => { addTeam(input.value); }
      input.onkeydown = e => { if (e.key === 'Enter') add() }
      return h('div', { class: 'card' },
        h('h2', {}, 'Teams'),
        h('div', { class: 'row' }, input, h('button', { type: 'button', onclick: add }, 'Add team')),
        h('div', { class: 'chips' },
          g.teams.map(t => {
            const used = g.rounds.some(r => r.teamId === t.id)
            const x = used
              ? h('button', { type: 'button', disabled: true, title: 'Delete this team’s rounds first', 'aria-label': 'Remove ' + t.name }, '×')
              : h('button', { type: 'button', 'aria-label': 'Remove ' + t.name, onclick: () => removeTeam(t.id) }, '×')
            return h('span', { class: 'chip' }, t.name, x)
          })),
        !g.teams.length && h('p', { class: 'muted' }, 'Create at least one team to start playing.'))
    }

    function renderSetup (g) {
      const p = state.prefs
      if (!play.teamId || !g.teams.some(t => t.id === play.teamId)) play.teamId = nextTeamId(g)

      const teamSel = h('select', { id: 'team-sel', onchange: e => { play.teamId = e.target.value } },
        options(g.teams.map(t => [t.id, t.name]), play.teamId))
      const actor = h('input', { type: 'text', placeholder: 'Who is acting?', value: play.actor, 'aria-label': 'Current actor',
        oninput: e => { play.actor = e.target.value } })
      const diffs = h('div', { class: 'seg', role: 'group' }, DIFFS.map(d =>
        h('button', { type: 'button', 'aria-pressed': String(p.difficulty === d), onclick: () => { p.difficulty = d; save(); renderPlay() } }, d[0].toUpperCase() + d.slice(1))))
      const cat = h('select', { onchange: e => { p.category = e.target.value; save() } }, options([ALL, ...categories()], p.category))
      const mins = h('input', { type: 'number', min: '0.25', max: '30', step: '0.25', value: p.minutes,
        onchange: e => { const v = parseFloat(e.target.value); p.minutes = v > 0 ? v : 2; e.target.value = p.minutes; save() } })

      return h('div', { class: 'card' },
        h('h2', {}, 'Next round'),
        field('Team', teamSel),
        field('Actor', actor),
        field('Difficulty', diffs),
        field('Category', cat),
        field('Time limit (minutes)', mins),
        h('button', { type: 'button', class: 'primary big', style: 'width:100%;margin-top:1rem;padding:0.8rem', disabled: !g.teams.length, onclick: getClue }, 'Get clue'))
    }

    // ---- scoreboard ------------------------------------------------------
    function renderScore () {
      const pane = document.getElementById('pane-score')
      const g = game()
      pane.replaceChildren()
      if (!g.teams.length) { pane.append(h('p', { class: 'muted' }, 'No teams yet. Add some on the Play tab.')); return }
      const rows = g.teams.map(t => {
        const rs = g.rounds.filter(r => r.teamId === t.id)
        const wins = rs.filter(r => r.won)
        return {
          name: t.name, played: rs.length, won: wins.length, lost: rs.length - wins.length,
          pct: rs.length ? Math.round(100 * wins.length / rs.length) : null,
          avg: wins.length ? wins.reduce((s, r) => s + r.elapsed, 0) / wins.length : null
        }
      }).sort((a, b) => b.won - a.won || (b.pct || 0) - (a.pct || 0) || a.name.localeCompare(b.name))
      const top = rows[0].won
      const table = h('table', {},
        h('thead', {}, h('tr', {}, h('th', {}, 'Team'), h('th', { class: 'n' }, 'Played'), h('th', { class: 'n' }, 'Won'), h('th', { class: 'n' }, 'Lost'), h('th', { class: 'n' }, 'Win %'), h('th', { class: 'n' }, 'Avg solve'))),
        h('tbody', {}, rows.map(r => h('tr', {},
          h('td', {}, (top > 0 && r.won === top ? '🏆 ' : '') + r.name),
          h('td', { class: 'n' }, r.played), h('td', { class: 'n' }, r.won), h('td', { class: 'n' }, r.lost),
          h('td', { class: 'n' }, r.pct == null ? '–' : r.pct + '%'),
          h('td', { class: 'n' }, r.avg == null ? '–' : fmtTime(r.avg))))))
      pane.append(h('div', { class: 'card' }, table))
    }

    // ---- history ---------------------------------------------------------
    let editingId = null // round id being edited, or 'new'

    function renderHistory () {
      const pane = document.getElementById('pane-history')
      const g = game()
      pane.replaceChildren()
      pane.append(h('div', { class: 'row', style: 'margin-bottom:0.75rem; justify-content: space-between' },
        h('span', { class: 'muted' }, g.rounds.length + ' round' + (g.rounds.length === 1 ? '' : 's')),
        h('button', { type: 'button', disabled: !g.teams.length || editingId === 'new', title: g.teams.length ? '' : 'Add a team first', onclick: () => { editingId = 'new'; renderHistory() } }, '+ Add round')))
      if (editingId === 'new') {
        pane.append(h('div', { class: 'card' }, roundForm(g, null)))
      }
      const list = h('div', { class: 'card' })
      const sorted = g.rounds.slice().sort((a, b) => b.ts - a.ts)
      if (!sorted.length) list.append(h('p', { class: 'muted' }, 'No rounds yet.'))
      sorted.forEach(r => {
        if (r.id === editingId) { list.append(h('div', { class: 'round' }, roundForm(g, r))); return }
        list.append(h('div', { class: 'round' },
          h('div', { class: 'top' },
            h('span', {}, r.clue),
            h('span', { class: r.won ? 'won' : 'lost' }, r.won ? 'Won ' + fmtTime(r.elapsed) : 'Lost')),
          h('div', { class: 'muted' },
            [fmtDate(r.ts), teamName(g, r.teamId), r.actor, r.difficulty + ' · ' + r.category, 'limit ' + fmtTime(r.limit)].filter(Boolean).join(' · ')),
          h('div', { class: 'btns' },
            h('button', { type: 'button', onclick: () => { editingId = r.id; renderHistory() } }, 'Edit'),
            twoClick('Delete', () => { g.rounds = g.rounds.filter(x => x.id !== r.id); save(); renderAll() }))))
      })
      pane.append(list)
    }

    function roundForm (g, r) {
      const isNew = !r
      const d = r || { ts: Date.now(), teamId: nextTeamId(g), actor: '', clue: '', category: categories()[0], difficulty: 'easy', limit: 120, elapsed: 120, won: false }
      const cats = categories().includes(d.category) ? categories() : [...categories(), d.category]
      const team = h('select', {}, options(g.teams.map(t => [t.id, t.name]), d.teamId))
      const actor = h('input', { type: 'text', value: d.actor })
      const clue = h('input', { type: 'text', value: d.clue })
      const cat = h('select', {}, options(cats, d.category))
      const diff = h('select', {}, options(DIFFS, d.difficulty))
      const limit = h('input', { type: 'number', min: '1', step: '1', value: d.limit })
      const elapsed = h('input', { type: 'number', min: '0', step: '0.1', value: d.elapsed })
      const result = h('select', {}, options([['won', 'Won'], ['lost', 'Lost']], d.won ? 'won' : 'lost'))
      const when = h('input', { type: 'datetime-local', value: toLocalInput(d.ts) })
      const err = h('p', { class: 'lost' })
      const submit = () => {
        const text = clue.value.trim()
        const lim = parseFloat(limit.value)
        const el = parseFloat(elapsed.value)
        const ts = new Date(when.value).getTime()
        if (!text) { err.textContent = 'Clue is required.'; return }
        if (!(lim > 0) || !(el >= 0)) { err.textContent = 'Enter a valid time limit and time used.'; return }
        if (isNaN(ts)) { err.textContent = 'Enter a valid date.'; return }
        const next = { id: d.id || uid(), ts, teamId: team.value, actor: actor.value.trim(), clue: text,
          category: cat.value, difficulty: diff.value, limit: lim, elapsed: el, won: result.value === 'won' }
        if (isNew) g.rounds.push(next)
        else g.rounds[g.rounds.findIndex(x => x.id === d.id)] = next
        editingId = null
        save()
        renderAll()
      }
      return h('div', {},
        h('div', { class: 'form-grid' },
          field('Clue', clue, 'full'),
          field('Team', team), field('Actor', actor),
          field('Category', cat), field('Difficulty', diff),
          field('Time limit (sec)', limit), field('Time used (sec)', elapsed),
          field('Result', result), field('When', when)),
        err,
        h('div', { class: 'row', style: 'margin-top:0.75rem' },
          h('button', { type: 'button', class: 'primary', onclick: submit }, isNew ? 'Add round' : 'Save'),
          h('button', { type: 'button', onclick: () => { editingId = null; renderHistory() } }, 'Cancel')))
    }

    // ---- games dialog, export -------------------------------------------
    function download (filename, data) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
      const url = URL.createObjectURL(blob)
      const a = h('a', { href: url, download: filename })
      document.body.append(a)
      a.click()
      a.remove()
      setTimeout(() => URL.revokeObjectURL(url), 1000)
    }
    function slug (s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'game' }
    function exportGames (games, filename) {
      download(filename, { app: 'charades', version: 1, exportedAt: new Date().toISOString(), games })
    }

    const dialog = document.getElementById('games-dialog')
    function renderGames () {
      const list = document.getElementById('games-list')
      list.replaceChildren()
      state.games.slice().sort((a, b) => b.createdAt - a.createdAt).forEach(g => {
        const wins = g.rounds.filter(r => r.won).length
        list.append(h('div', { class: 'game' + (g.id === state.currentId ? ' current' : '') },
          h('div', { class: 'info' }, h('strong', {}, g.name),
            h('div', { class: 'muted' }, new Date(g.createdAt).toLocaleDateString() + ' · ' + g.teams.length + ' teams · ' + g.rounds.length + ' rounds (' + wins + ' won)')),
          h('button', { type: 'button', class: 'primary', disabled: g.id === state.currentId, onclick: () => openGame(g.id) }, 'Open'),
          h('button', { type: 'button', onclick: () => exportGames([g], 'charades-' + slug(g.name) + '.json') }, 'Export'),
          twoClick('Delete', () => deleteGame(g.id))))
      })
    }

    function confirmLeaveRound () {
      return play.phase !== 'running' || confirm('A round is in progress. Discard it?')
    }
    function openGame (id) {
      if (id !== state.currentId && !confirmLeaveRound()) return
      state.currentId = id
      editingId = null
      resetPlay()
      save()
      dialog.close()
      renderAll()
    }
    function deleteGame (id) {
      const wasCurrent = id === state.currentId
      state.games = state.games.filter(g => g.id !== id)
      if (!state.games.length) state.games.push(makeGame())
      if (wasCurrent) { state.currentId = state.games[0].id; editingId = null; resetPlay() }
      save()
      renderAll()
      renderGames()
    }

    document.getElementById('new-game').onclick = () => {
      if (!confirmLeaveRound()) return
      const g = makeGame()
      state.games.push(g)
      state.currentId = g.id
      editingId = null
      resetPlay()
      save()
      showTab('play')
      renderAll()
    }
    document.getElementById('games-btn').onclick = () => { renderGames(); dialog.showModal() }
    document.getElementById('games-close').onclick = () => dialog.close()
    document.getElementById('export-all').onclick = () =>
      exportGames(state.games, 'charades-all-' + new Date().toISOString().slice(0, 10) + '.json')

    const nameInput = document.getElementById('game-name')
    nameInput.onchange = () => {
      game().name = nameInput.value.trim() || game().name
      nameInput.value = game().name
      save()
    }

    // ---- tabs ------------------------------------------------------------
    function showTab (name) {
      document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)))
      ;['play', 'score', 'history'].forEach(t => { document.getElementById('pane-' + t).hidden = t !== name })
    }
    document.querySelectorAll('.tabs button').forEach(b => { b.onclick = () => showTab(b.dataset.tab) })

    function renderAll () {
      nameInput.value = game().name
      renderPlay()
      renderScore()
      renderHistory()
    }
    renderAll()
  </script>
</body>
</html>
