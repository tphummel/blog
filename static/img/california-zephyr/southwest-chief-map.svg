<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 521" role="img" aria-labelledby="mapTitle mapDesc">
  <title id="mapTitle">Southwest Chief route map, Los Angeles to Chicago</title>
  <desc id="mapDesc">A route map of Amtrak's Southwest Chief from Los Angeles, California across Arizona, New Mexico, Colorado, Kansas, Missouri, Iowa and Illinois to Chicago, with stops at Barstow, Flagstaff, Albuquerque, Lamy, Raton, Dodge City and Kansas City.</desc>
  <rect class="bg" x="0" y="0" width="960" height="521"/>
  <style>
    svg {
      --ink: #000;
      --ink-dim: rgba(0,0,0,0.45);
      --ink-faint: rgba(0,0,0,0.18);
      font-family: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
    .bg { fill: #fff; }
    .state { fill: none; stroke: var(--ink-faint); stroke-width: 1.5; stroke-linejoin: round; }
    .state-label { fill: var(--ink-dim); font-size: 13px; letter-spacing: 3px; }
    .route { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1 9; }
    .leader line { stroke: var(--ink-dim); stroke-width: 1; }
    .stop { fill: var(--ink); stroke: none; }
    .city-name { fill: var(--ink); font-size: 12px; font-weight: 700; }
    .city-sub { fill: var(--ink-dim); font-size: 10px; }
    .title { fill: var(--ink); font-size: 23px; font-weight: 700; letter-spacing: 1px; }
    .subtitle { fill: var(--ink-dim); font-size: 13px; }
    .chrome { fill: var(--ink-dim); font-size: 11px; }
    .chrome-line { stroke: var(--ink-dim); stroke-width: 1.5; }
  </style>

  <text class="title" x="520" y="425">SOUTHWEST CHIEF</text>
  <text class="subtitle" x="520" y="447">Los Angeles &#8594; Chicago &#183; 2,265 miles &#183; about 43 hours</text>

