<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tomhummel.com - pictionary clue generator</title>
  <style>
    :root {
      --bg: #fafafa;
      --fg: #222;
      --muted: #777;
      --accent: #2b6cb0;
      --border: #ccc;
    }
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      max-width: 36rem;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }
    h1 { font-size: 1.4rem; margin-top: 0; }
    label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
    select, button {
      font: inherit;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
    }
    select { width: 100%; }
    .difficulty { display: flex; gap: 0.5rem; }
    .difficulty button { flex: 1; cursor: pointer; }
    .difficulty button[aria-pressed="true"] {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .actions { display: flex; gap: 0.5rem; margin-top: 1.5rem; }
    .actions button { cursor: pointer; flex: 1; }
    #generate { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
    #clue-box {
      margin-top: 1.5rem;
      min-height: 7rem;
      border: 2px dashed var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1rem;
    }
    #clue { font-size: 2rem; font-weight: 700; margin: 0; word-break: break-word; }
    #clue.hidden { color: var(--muted); font-size: 1.1rem; font-weight: 400; }
    #meta { color: var(--muted); font-size: 0.85rem; text-align: center; margin-top: 0.5rem; min-height: 1.2em; }
    #timer { font-variant-numeric: tabular-nums; font-size: 1.5rem; text-align: center; margin: 1rem 0 0; }
    #history { color: var(--muted); font-size: 0.9rem; margin-top: 1.5rem; }
    #history ol { padding-left: 1.25rem; margin: 0.25rem 0; }
  </style>
</head>
<body>
  <h1>Pictionary clue generator</h1>

  <label for="category">Category</label>
  <select id="category"></select>

  <label id="difficulty-label">Difficulty</label>
  <div class="difficulty" role="group" aria-labelledby="difficulty-label">
    <button type="button" data-d="easy" aria-pressed="true">Easy</button>
    <button type="button" data-d="medium" aria-pressed="false">Medium</button>
    <button type="button" data-d="hard" aria-pressed="false">Hard</button>
  </div>

  <div class="actions">
    <button type="button" id="generate">New clue</button>
    <button type="button" id="reveal">Hide / show</button>
    <button type="button" id="timer-btn">Start 60s timer</button>
  </div>

  <div id="clue-box"><p id="clue" class="hidden">Press &ldquo;New clue&rdquo;</p></div>
  <div id="meta"></div>
  <p id="timer" aria-live="off"></p>

  <div id="history"></div>

    const ALL = 'All categories'
    const categorySelect = document.getElementById('category')
    const clueEl = document.getElementById('clue')
    const metaEl = document.getElementById('meta')
    const historyEl = document.getElementById('history')
    const timerEl = document.getElementById('timer')
    const timerBtn = document.getElementById('timer-btn')

    let difficulty = 'easy'
    let current = null
    let hidden = false
    let history = []
    // clues already shown, per "category|difficulty" pool, so repeats wait until the pool is used up
    const used = {}
    let timerId = null

    ;[ALL, ...Object.keys(CLUES)].forEach(name => {
      const opt = document.createElement('option')
      opt.value = opt.textContent = name
      categorySelect.appendChild(opt)
    })

    function pool (category) {
      const cats = category === ALL ? Object.keys(CLUES) : [category]
      return cats.flatMap(c => CLUES[c][difficulty].map(text => ({ text, category: c })))
    }

    function generate () {
      const category = categorySelect.value
      const key = category + '|' + difficulty
      const all = pool(category)
      let used_ = used[key] || (used[key] = new Set())
      if (used_.size >= all.length) used_ = used[key] = new Set()
      const remaining = all.filter(c => !used_.has(c.text))
      current = remaining[Math.floor(Math.random() * remaining.length)]
      used_.add(current.text)
      hidden = false
      history.unshift(current.text)
      history = history.slice(0, 10)
      render()
    }

    function render () {
      if (!current) return
      clueEl.className = hidden ? 'hidden' : ''
      clueEl.textContent = hidden ? '(hidden)' : current.text
      metaEl.textContent = current.category + ' \u00b7 ' + difficulty
      historyEl.innerHTML = ''
      if (history.length > 1) {
        historyEl.append('Recent clues:')
        const ol = document.createElement('ol')
        history.slice(1).forEach(t => {
          const li = document.createElement('li')
          li.textContent = t
          ol.appendChild(li)
        })
        historyEl.appendChild(ol)
      }
    }

    function toggleTimer () {
      if (timerId) {
        clearInterval(timerId)
        timerId = null
        timerEl.textContent = ''
        timerBtn.textContent = 'Start 60s timer'
        return
      }
      let left = 60
      timerEl.textContent = left + 's'
      timerBtn.textContent = 'Stop timer'
      timerId = setInterval(() => {
        left -= 1
        timerEl.textContent = left > 0 ? left + 's' : "Time's up!"
        if (left <= 0) {
          clearInterval(timerId)
          timerId = null
          timerBtn.textContent = 'Start 60s timer'
        }
      }, 1000)
    }

    document.querySelectorAll('.difficulty button').forEach(btn => {
      btn.addEventListener('click', () => {
        difficulty = btn.dataset.d
        document.querySelectorAll('.difficulty button').forEach(b =>
          b.setAttribute('aria-pressed', String(b === btn)))
        if (current) generate()
      })
    })
    categorySelect.addEventListener('change', () => { if (current) generate() })
    document.getElementById('generate').addEventListener('click', generate)
    document.getElementById('reveal').addEventListener('click', () => {
      if (!current) return
      hidden = !hidden
      render()
    })
    timerBtn.addEventListener('click', toggleTimer)
  </script>
