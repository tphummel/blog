<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tomhummel.com - 5 minute journal prompt generator</title>
  <style>
    :root { --bg: #faf7f0; --ink: #2b2b2b; --accent: #3b6e5c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1d1f1e; --ink: #e8e6e0; --accent: #7fc4a8; } }
    body { background: var(--bg); color: var(--ink); font-family: Georgia, serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    main { max-width: 36rem; padding: 2rem 1.25rem; text-align: center; }
    h1 { font-size: 1rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: normal; }
    #prompt { font-size: 1.8rem; line-height: 1.3; min-height: 6rem; margin: 1.5rem 0; }
    button { font: inherit; background: var(--accent); color: var(--bg); border: 0; border-radius: 6px; padding: .6rem 1.2rem; margin: .25rem; cursor: pointer; }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    #timer { font-variant-numeric: tabular-nums; font-size: 1.5rem; margin-top: 1rem; }
    small { display: block; margin-top: 2rem; opacity: .7; }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>5 minute journal prompt</h1>
  <div id="prompt" aria-live="polite"></div>
  <button id="next">New prompt</button>
  <button id="timerBtn" class="secondary">Start 5:00 timer</button>
  <div id="timer" hidden>5:00</div>
  <small><span id="count"></span> prompts · <a href="/experiments">experiments</a></small>
</main>
<script src="prompts.js"></script>
<script>
  const prompts = window.PROMPTS;
  const el = document.getElementById("prompt");
  document.getElementById("count").textContent = prompts.length;
  let bag = [], last = -1;
  function pick() {
    if (!bag.length) {
      bag = prompts.map((_, i) => i).sort(() => Math.random() - 0.5);
      if (bag.length > 1 && bag[bag.length - 1] === last) bag.unshift(bag.pop());
    }
    last = bag.pop();
    return prompts[last];
  }
  function show() { el.textContent = pick(); }
  document.getElementById("next").onclick = show;
  let t = null;
  const timer = document.getElementById("timer"), btn = document.getElementById("timerBtn");
  btn.onclick = () => {
    if (t) { clearInterval(t); t = null; timer.hidden = true; btn.textContent = "Start 5:00 timer"; return; }
    let s = 300; timer.hidden = false; btn.textContent = "Stop timer";
    const tick = () => { timer.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); if (s-- <= 0) { clearInterval(t); t = null; timer.textContent = "Time's up"; btn.textContent = "Start 5:00 timer"; } };
    tick(); t = setInterval(tick, 1000);
  };
  show();
</script>
</body>
</html>
